name: example-assignment

services:
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: assignment1
      MYSQL_USER: assignment
      MYSQL_PASSWORD: assignment
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-u", "assignment", "-passignment", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
